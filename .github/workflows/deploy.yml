name: Deploy FoodBridge AI to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build

      - name: Verify build output
        run: |
          echo "--- Verifying dist/ output ---"
          test -f dist/index.html || { echo "ERROR: dist/index.html does not exist"; exit 1; }
          if grep -q '/src/main.tsx' dist/index.html; then
            echo "ERROR: dist/index.html still references /src/main.tsx"
            exit 1
          fi
          test -f dist/404.html || { echo "ERROR: dist/404.html does not exist"; exit 1; }
          test -f dist/.nojekyll || { echo "ERROR: dist/.nojekyll does not exist"; exit 1; }
          ls dist/assets/*.js 1> /dev/null 2>&1 || { echo "ERROR: Required JS assets missing in dist/assets/"; exit 1; }
          ls dist/assets/*.css 1> /dev/null 2>&1 || { echo "ERROR: Required CSS assets missing in dist/assets/"; exit 1; }
          echo "SUCCESS: Build verification passed. All artifacts present."

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
