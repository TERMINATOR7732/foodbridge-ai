<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>FoodBridge AI</title>
  <script>
    // Single-page app fallback for GitHub Pages.
    // When GitHub Pages serves a 404 for a deep route (e.g. /foodbridge-ai/donate),
    // this page redirects to index.html, encoding the original path in the query
    // string so the app can restore it with history.replaceState.
    // Technique: https://github.com/rafgraph/spa-github-pages
    var pathSegmentsToKeep = 1; // number of path segments for the repo sub-path
    var l = window.location;
    l.replace(
      l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
      l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
      l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
      (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
      l.hash
    );
  </script>
</head>
<body></body>
</html>
